name: cd

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-central-1
  ARTIFACT_PREFIX: artifacts/jobs # s3://cde-spark-script/artifacts/jobs/freight_route_metrics.py

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: spark-jobs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload job scripts
        run: |
          aws s3 sync spark_jobs/ "s3://cde-spark-script/artifacts/jobs/freight_route_metrics.py" \
            --exclude "*" --include "*.py"

      - name: Upload commit-pinned copy
        run: |
          aws s3 sync spark_jobs/ "s3://cde-spark-script/${ARTIFACT_PREFIX}/${GITHUB_SHA}/" \
            --exclude "*" --include "*.py"