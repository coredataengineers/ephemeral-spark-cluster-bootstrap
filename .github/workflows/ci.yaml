name: ci

on:
  pull_request:
    branches: [main]
    paths:
      - "jobs/**"
      - ".github/workflows/ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check jobs/

      - name: Check formatting
        run: ruff format --check jobs/